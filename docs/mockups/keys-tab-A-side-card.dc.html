<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Layout A: side card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@500;700&amp;family=Grenze+Gotisch:wght@700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>
body{margin:0;background:#0f0b14}
*{box-sizing:border-box}
button{font-family:inherit}
a{color:#d6b066}a:hover{color:#f0e9f6}
.board{background-color:#150f1b;background-image:radial-gradient(rgba(169,155,183,.11) 1px,transparent 1.2px);background-size:18px 18px}
.cap{position:absolute;padding:0;border-radius:9px;border:1px solid #3a2f47;background:linear-gradient(#2f2639,#1b1524);box-shadow:inset 0 -5px 0 #08060b,inset 0 1px 0 rgba(255,255,255,.07),0 3px 8px rgba(0,0,0,.45);cursor:pointer}
.cap.m{background:linear-gradient(#1f2b26,#141c18);border-color:#2b3b33;cursor:default}
.cap.sel{border-color:#d6b066;box-shadow:inset 0 -5px 0 #08060b,0 0 0 3px rgba(214,176,102,.30),0 0 22px rgba(214,176,102,.30)}
.leg{position:absolute;left:6px;top:4px;font:700 10px 'JetBrains Mono',monospace;color:#a99bb7}
.cap.m .leg{color:#7fa985}
.cap.sel .leg{color:#d6b066}
.big{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%)}
.ico{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:none;border-radius:5px;font:700 11px 'JetBrains Mono',monospace;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.7);box-shadow:inset 0 0 0 1px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.2)}
.ico.big{position:absolute}
.ico.xs{font-size:8px;border-radius:4px}
.cnt{position:absolute;right:-7px;bottom:-6px;min-width:15px;height:15px;padding:0 3px;border-radius:8px;background:#0b0810;border:1px solid #d6b066;font:700 9px/13px 'JetBrains Mono',monospace;color:#d6b066;text-align:center;text-shadow:none}
.pips{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:3px}
.pip{width:8px;height:8px;border-radius:2px}
.pip.off{border:1px solid #3a2f47}
.mouse{position:absolute;overflow:hidden;border:1px solid #3a2f47;background:linear-gradient(165deg,#2f2639,#16111d);box-shadow:0 8px 22px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.07)}
.lmb,.rmb{position:absolute;top:0;height:42%;width:50%;border-bottom:1px solid #3a2f47;display:flex;align-items:flex-end;justify-content:center;padding-bottom:7px;font:700 8px 'JetBrains Mono',monospace;color:#a99bb7;letter-spacing:.06em}
.lmb{left:0;border-right:1px solid #3a2f47}
.rmb{left:50%}
.mb{position:absolute;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:1px solid #3a2f47;background:linear-gradient(#352b42,#1d1726);box-shadow:inset 0 -3px 0 #08060b,0 2px 6px rgba(0,0,0,.55);cursor:pointer}
.mb.sel{border-color:#d6b066;box-shadow:0 0 0 3px rgba(214,176,102,.3)}
.ml{font:700 8px 'JetBrains Mono',monospace;color:#a99bb7}
.dot{position:absolute;right:3px;top:3px;width:5px;height:5px;border-radius:3px;background:#d6b066}
.tab{height:44px;padding:0 14px;background:none;border:0;border-bottom:2px solid transparent;color:#a99bb7;font:700 15px 'Alegreya Sans',sans-serif;cursor:pointer}
.tab.on{color:#f0e9f6;border-bottom-color:#d6b066}
.btn{height:32px;padding:0 14px;border-radius:7px;border:1px solid #3a2f47;background:#241c2e;color:#f0e9f6;font:700 14px 'Alegreya Sans',sans-serif;display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.btn.go{background:#93d35a;border-color:#93d35a;color:#0f0b14;padding:0 22px}
.btn.sm{height:26px;padding:0 10px;font-size:13px}
.ib{width:26px;height:26px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;border:1px solid transparent;background:none;color:#a99bb7;cursor:pointer;flex:none}
.ib.on{color:#93d35a;border-color:#3d5a29;background:rgba(147,211,90,.08)}
.sw{width:28px;height:16px;border-radius:8px;background:#3a2f47;position:relative;display:inline-block}
.sw i{position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:6px;background:#a99bb7}
.sw.on{background:#41602a}
.sw.on i{left:14px;background:#93d35a}
.mod{display:inline-flex;align-items:center;justify-content:center;height:20px;padding:0 7px;border-radius:5px;background:#0b0810;border:1px solid #3a2f47;font:700 10px 'JetBrains Mono',monospace;letter-spacing:.05em;color:#d6b066;text-transform:uppercase;flex:none}
.plus{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:7px;border:1.5px dashed #a77ce8;background:rgba(167,124,232,.10);color:#c7aef2;font:700 13px 'Alegreya Sans',sans-serif;cursor:pointer;flex:none}
.plust{width:24px;height:24px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:5px;border:1.5px dashed #a77ce8;background:rgba(167,124,232,.10);color:#c7aef2;cursor:pointer;flex:none}
.mono{font:500 11px 'JetBrains Mono',monospace;color:#a99bb7}
.meter{height:4px;border-radius:2px;background:#0b0810;overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:#93d35a;border-radius:2px}
.ck{display:inline-flex;align-items:center;gap:6px;font:500 13px 'Alegreya Sans',sans-serif;color:#f0e9f6}
.ck input{accent-color:#93d35a;width:14px;height:14px;margin:0}
.tg{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:12px;border:1px solid #3a2f47;background:none;color:#a99bb7;font:700 12px 'Alegreya Sans',sans-serif;cursor:pointer}
.tg.on{border-color:#93d35a;color:#93d35a;background:rgba(147,211,90,.08)}
.secs{width:30px;height:18px;border-radius:4px;border:1px solid #3a2f47;background:#0b0810;color:#f0e9f6;font:700 11px 'JetBrains Mono',monospace;text-align:center;padding:0}
.empty{display:flex;align-items:center;gap:10px;width:100%;border-radius:9px;border:1.5px dashed #4a3d5a;background:none;color:#a99bb7;font:700 13px 'Alegreya Sans',sans-serif;cursor:pointer;text-align:left}
.slot{border:1px solid #3a2f47;border-radius:9px;background:#211a2a}
.slot.open{border-color:#a77ce8;background:#231b2f;box-shadow:0 0 0 3px rgba(167,124,232,.12)}
.srow{display:flex;align-items:center;gap:8px;height:40px;padding:0 6px 0 8px}
.nm{font:700 14px 'Alegreya Sans',sans-serif;color:#f0e9f6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step{display:flex;align-items:center;gap:8px;height:28px;padding:0 6px 0 10px}
.num{width:14px;font:700 11px 'JetBrains Mono',monospace;color:#a99bb7;text-align:right;flex:none}
.sep{color:#6d5a83;flex:none;display:inline-flex}
</style>
</helmet>
<div style="width: 960px; height: 640px; position: relative; background: #120d18; border: 1px solid #3a2f47; border-radius: 12px; overflow: hidden; font-family: 'Alegreya Sans', sans-serif; color: #f0e9f6;">

<div style="position: absolute; left: 0; top: 0; right: 0; height: 44px; display: flex; align-items: center; gap: 22px; padding: 0 8px 0 18px; border-bottom: 1px solid #3a2f47; background: #1a1421;">
<div style="font: 700 22px 'Grenze Gotisch', serif; color: #d6b066;">Foil Keybinds</div>
<nav style="display: flex; gap: 2px; height: 44px;"><button class="tab on">Keys</button><button class="tab">Settings</button></nav>
<div style="flex-grow: 1;"></div>
<button class="ib" aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>

<div class="board" style="position: absolute; left: 16px; top: 56px; width: 540px; height: 520px; border: 1px solid #3a2f47; border-radius: 10px; overflow: hidden;">
<sc-for list="{{keys}}" as="k" hint-placeholder-count="20">
<button class="{{k.cls}}" style="{{k.style}}" aria-label="Key {{k.label}}">
<span class="leg">{{k.label}}</span>
<sc-if value="{{k.has}}" hint-placeholder-val="{{true}}"><span class="ico big" style="{{k.icon}}">{{k.g}}<sc-if value="{{k.hasCnt}}" hint-placeholder-val="{{false}}"><span class="cnt">{{k.cnt}}</span></sc-if></span></sc-if>
<sc-if value="{{k.hasPips}}" hint-placeholder-val="{{true}}"><span class="pips"><sc-for list="{{k.pips}}" as="p" hint-placeholder-count="4"><i class="{{p.cls}}" style="{{p.style}}"></i></sc-for></span></sc-if>
</button>
</sc-for>
<div class="mouse" style="{{mouse}}" aria-hidden="true"><span class="lmb">GAME</span><span class="rmb">GAME</span></div>
<sc-for list="{{mbs}}" as="b" hint-placeholder-count="3">
<button class="{{b.cls}}" style="{{b.style}}" aria-label="Mouse button {{b.label}}">
<span class="ml">{{b.label}}</span>
<sc-if value="{{b.has}}" hint-placeholder-val="{{true}}"><span class="ico xs" style="{{b.icon}}">{{b.g}}</span></sc-if>
<sc-if value="{{b.mod}}" hint-placeholder-val="{{false}}"><i class="dot"></i></sc-if>
</button>
</sc-for>
<div style="position: absolute; left: 14px; right: 12px; bottom: 12px; display: flex; align-items: center; gap: 10px;">
<span class="mono">Drag to pan. Wheel to zoom.</span>
<div style="flex-grow: 1;"></div>
<div style="display: flex; align-items: center; gap: 2px; border: 1px solid #3a2f47; border-radius: 7px; background: #1a1421; padding: 2px;">
<button class="ib" aria-label="Zoom out"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
<span class="mono" style="width: 38px; text-align: center; color: #f0e9f6;">85%</span>
<button class="ib" aria-label="Zoom in"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
<button class="ib" aria-label="Reset view"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 15v5h-5M4 4l6 6M20 20l-6-6"></path></svg></button>
</div>
</div>
</div>

<section aria-label="Key 2" style="position: absolute; left: 568px; top: 56px; width: 376px; height: 520px; padding: 14px; border: 1px solid #3a2f47; border-radius: 10px; background: #1a1421; display: flex; flex-direction: column; gap: 6px;">
<header style="display: flex; align-items: flex-end; justify-content: space-between; padding-bottom: 6px;">
<div><div style="font: 700 22px 'Alegreya Sans', sans-serif; line-height: 1;">Key 2</div><div class="mono" style="margin-top: 3px;">macro FKB 2</div></div>
<div style="width: 112px;"><div class="mono" style="display: flex; justify-content: space-between;"><span>size</span><span style="color: #f0e9f6;">142/255</span></div><div class="meter"><i style="width: 56%;"></i></div></div>
</header>

<div class="slot open">
<div class="srow">
<span class="mod">Normal</span>
<span class="ico" style="background: linear-gradient(135deg,#86c24f,#1f3d17); width: 24px; height: 24px;">Co</span>
<span class="sep"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></span>
<span class="ico" style="background: linear-gradient(135deg,#86c24f,#1f3d17); width: 24px; height: 24px;">Ag</span>
<span class="sep"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></span>
<span class="ico" style="background: linear-gradient(135deg,#e8913f,#6b2311); width: 24px; height: 24px;">Im</span>
<span style="font: 700 12px 'Alegreya Sans', sans-serif; color: #c7aef2;">Cast sequence</span>
<div style="flex-grow: 1;"></div>
<button class="btn sm">Done</button>
</div>
<ol style="list-style: none; margin: 0; padding: 0 0 2px;">
<li class="step"><span class="num">1</span><span class="ico" style="background: linear-gradient(135deg,#86c24f,#1f3d17); width: 20px; height: 20px; font-size: 9px;">Co</span><span class="nm" style="flex-grow: 1; font-size: 13px;">Corruption</span><button class="ib" aria-label="Move up" style="opacity: .35;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg></button><button class="ib" aria-label="Move down"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button><button class="ib" aria-label="Remove"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></li>
<li class="step"><span class="num">2</span><span class="ico" style="background: linear-gradient(135deg,#86c24f,#1f3d17); width: 20px; height: 20px; font-size: 9px;">Ag</span><span class="nm" style="flex-grow: 1; font-size: 13px;">Curse of Agony</span><button class="ib" aria-label="Move up"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg></button><button class="ib" aria-label="Move down"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button><button class="ib" aria-label="Remove"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></li>
<li class="step"><span class="num">3</span><span class="ico" style="background: linear-gradient(135deg,#e8913f,#6b2311); width: 20px; height: 20px; font-size: 9px;">Im</span><span class="nm" style="flex-grow: 1; font-size: 13px;">Immolate</span><button class="ib" aria-label="Move up"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg></button><button class="ib" aria-label="Move down" style="opacity: .35;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button><button class="ib" aria-label="Remove"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></li>
</ol>
<div style="padding: 0 8px 4px 32px;"><button class="plus" style="width: 100%; height: 26px; justify-content: center;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add spell to the sequence</button></div>
<div style="display: flex; align-items: center; gap: 6px; padding: 4px 8px 8px 10px;">
<span class="mono" style="margin-right: 2px;">Start over:</span>
<button class="tg on" aria-pressed="true">New target</button>
<button class="tg" aria-pressed="false">Leave combat</button>
<label class="tg">After <input class="secs" aria-label="Seconds" placeholder="off"> s</label>
</div>
</div>

<div class="slot"><div class="srow">
<span class="mod">Shift</span>
<span class="ico" style="background: linear-gradient(135deg,#86c24f,#1f3d17); width: 24px; height: 24px;">SL</span>
<span class="nm" style="flex-grow: 1;">Siphon Life</span>
<button class="plus" aria-label="Add a spell after Siphon Life: makes a cast sequence"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Next</button>
<button class="ib on" aria-label="Mouseover on" aria-pressed="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
<button class="ib" aria-label="Clear slot"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg></button>
</div></div>

<div class="slot"><div class="srow">
<span class="mod">Ctrl</span>
<span class="ico" style="background: linear-gradient(135deg,#e8913f,#6b2311); width: 24px; height: 24px;">Im</span>
<span class="sep"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></span>
<span class="ico" style="background: linear-gradient(135deg,#e8913f,#6b2311); width: 24px; height: 24px;">Cf</span>
<button class="plust" aria-label="Add a spell to this sequence"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
<span class="mono" style="flex-grow: 1; color: #c7aef2;">2 spells</span>
<button class="btn sm"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"></path></svg>Edit</button>
<button class="ib" aria-label="Clear slot"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg></button>
</div></div>

<button class="empty" style="height: 38px; padding: 0 8px;"><span class="mod">Alt</span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Choose a spell or item</button>
<button class="empty" style="height: 38px; padding: 0 8px;"><span class="mod">Alt+Shift</span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Choose a spell or item</button>

<div style="margin-top: auto; display: flex; align-items: center; gap: 14px; padding-top: 10px; border-top: 1px solid #3a2f47;">
<label class="ck"><input type="checkbox" checked> Target enemy if none</label>
<label class="ck"><input type="checkbox"> Pet attacks</label>
<div style="flex-grow: 1;"></div>
<a href="#macro" style="font: 700 13px 'Alegreya Sans', sans-serif;">Show macro</a>
</div>
</section>

<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 52px; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-top: 1px solid #3a2f47; background: #1a1421;">
<button class="btn">Cheat sheet</button>
<div style="flex-grow: 1;"></div>
<button class="btn" aria-pressed="true"><span class="sw on"><i></i></span>Bars &amp; keybinds</button>
<button class="btn">Refresh items</button>
<button class="btn">Copy from</button>
<button class="btn">Undo</button>
<button class="btn go">Apply</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    const G = { sh: 'linear-gradient(135deg,#7b4cc4,#2a1745)', fi: 'linear-gradient(135deg,#e8913f,#6b2311)', af: 'linear-gradient(135deg,#86c24f,#1f3d17)', de: 'linear-gradient(135deg,#b48cf0,#3b2560)', it: 'linear-gradient(135deg,#e0bb6e,#5b4520)', pe: 'linear-gradient(135deg,#ef6d62,#5a1c1a)' };
    const SP = { SB: ['Shadow Bolt', 'SB', 'sh'], SF: ['Soul Fire', 'SF', 'fi'], CO: ['Corruption', 'Co', 'af'], AG: ['Curse of Agony', 'Ag', 'af'], IM: ['Immolate', 'Im', 'fi'], CF: ['Conflagrate', 'Cf', 'fi'], SL: ['Siphon Life', 'SL', 'af'], CR: ['Curse of Recklessness', 'CR', 'af'], DL: ['Drain Life', 'DL', 'af'], DM: ['Drain Mana', 'DM', 'af'], LT: ['Life Tap', 'LT', 'de'], DP: ['Dark Pact', 'DP', 'de'], FE: ['Fear', 'Fe', 'af'], HT: ['Howl of Terror', 'HT', 'af'], DC: ['Death Coil', 'DC', 'af'], HS: ['Major Healthstone', 'Hs', 'it'], HP: ['Major Healing Potion', 'Hp', 'it'], SBN: ['Shadowburn', 'Sb', 'sh'], BA: ['Banish', 'Ba', 'de'], DS: ['Drain Soul', 'DS', 'af'], PA: ['Pet: attack', 'Pa', 'pe'], BD: ['Heavy Runecloth Bandage', 'Bd', 'it'], DA: ['Demon Armor', 'DA', 'de'], SP: ['Searing Pain', 'SP', 'fi'], CW: ['Curse of Weakness', 'CW', 'af'], CT: ['Curse of Tongues', 'CT', 'af'], SW: ['Shadow Ward', 'SW', 'sh'] };
    const AS = { '1': { normal: ['SB'], shift: ['SF'] }, '2': { normal: ['CO', 'AG', 'IM'], shift: ['SL'], ctrl: ['IM', 'CF'] }, '3': { normal: ['IM'] }, '4': { normal: ['DL'], shift: ['DM'] }, '5': { normal: ['LT'], shift: ['DP'] }, Q: { normal: ['FE'], shift: ['CR'], ctrl: ['HT'], alt: ['DC'] }, E: { normal: ['HS'], shift: ['HP'] }, R: { normal: ['SBN'] }, T: { normal: ['BA'] }, F: { normal: ['DS'] }, G: { normal: ['PA'] }, Z: { normal: ['BD'] }, X: { normal: ['DA'] }, B3: { normal: ['SP'] }, B4: { normal: ['CW'], shift: ['CT'] }, B5: { normal: ['SW'] } };
    const U = 56, K = 50, OX = 28, OY = 100, MX = 378, MY = 92, MS = 0.85, SEL = '2', BIG = 26;
    const tile = (c, n) => 'background:' + G[SP[c][2]] + ';width:' + n + 'px;height:' + n + 'px';
    const pips = (a) => ['shift', 'ctrl', 'alt', 'altshift'].map((m) => a[m] ? { cls: 'pip', style: 'background:' + G[SP[a[m][0]][2]] } : { cls: 'pip off', style: '' });
    const LAY = [['1', 0, 0], ['2', 1, 0], ['3', 2, 0], ['4', 3, 0], ['5', 4, 0], ['Q', 0.5, 1], ['W', 1.5, 1, 1, 1], ['E', 2.5, 1], ['R', 3.5, 1], ['T', 4.5, 1], ['A', 0.75, 2, 1, 1], ['S', 1.75, 2, 1, 1], ['D', 2.75, 2, 1, 1], ['F', 3.75, 2], ['G', 4.75, 2], ['Z', 1.25, 3], ['X', 2.25, 3], ['C', 3.25, 3], ['V', 4.25, 3], ['SPACE', 2, 4, 4]];
    const keys = LAY.map(([k, c, r, w, m]) => {
      const a = AS[k] || {}, n = a.normal;
      return {
        label: k === 'SPACE' ? 'Space' : k,
        cls: 'cap' + (m ? ' m' : '') + (k === SEL ? ' sel' : ''),
        style: 'left:' + (OX + c * U) + 'px;top:' + (OY + r * U) + 'px;width:' + (K + ((w || 1) - 1) * U) + 'px;height:' + K + 'px',
        has: !!n, g: n ? SP[n[0]][1] : '', icon: n ? tile(n[0], BIG) : '',
        hasCnt: !!(n && n.length > 1), cnt: n ? String(n.length) : '',
        hasPips: !m, pips: m ? [] : pips(a),
      };
    });
    const s = MS, mw = 150 * s, mh = 232 * s;
    const mb = (k, label, x, y, w, h, r, isz) => {
      const a = AS[k] || {}, n = a.normal;
      return { label: label, cls: 'mb' + (k === SEL ? ' sel' : ''), style: 'left:' + x + 'px;top:' + y + 'px;width:' + w + 'px;height:' + h + 'px;border-radius:' + r + 'px', has: !!n, g: n ? SP[n[0]][1] : '', icon: n ? tile(n[0], isz) : '', mod: !!(a.shift || a.ctrl || a.alt || a.altshift) };
    };
    const mouse = 'left:' + MX + 'px;top:' + MY + 'px;width:' + mw + 'px;height:' + mh + 'px;border-radius:' + (mw / 2) + 'px ' + (mw / 2) + 'px ' + (mw * 0.44) + 'px ' + (mw * 0.44) + 'px';
    const mbs = [
      mb('B3', 'M3', MX + (mw - 30 * s) / 2, MY + 22 * s, 30 * s, 66 * s, 15 * s, Math.round(20 * s)),
      mb('B4', 'M4', MX - 18 * s, MY + mh * 0.48, 36 * s, 46 * s, 9 * s, Math.round(20 * s)),
      mb('B5', 'M5', MX - 18 * s, MY + mh * 0.48 + 52 * s, 36 * s, 46 * s, 9 * s, Math.round(20 * s)),
    ];
    return { keys: keys, mouse: mouse, mbs: mbs };
  }
